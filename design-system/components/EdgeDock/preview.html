<!-- @dsCard group="Shell" height=380 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>EdgeDock — preview</title></head>
<body>
<div style="position:relative;height:380px;overflow:hidden"><div class="k-wall" data-follow style="background-image:url(../../assets/Wallpapers/neptunus.jpg);background-position:center 30%"></div>
  <div class="micro" style="position:absolute;right:16px;top:12px;color:var(--text-faint)">Preview only: move the pointer to the bottom edge</div>
  <div class="k-dockbar">
<div class="k-dock" id="dock">
  <div class="k-panel k-surface" id="p-media" style="width:344px;padding:0">
    <div class="k-media"><div class="k-cover"><i class="k-icon" data-icon="disc-3"></i></div><div style="min-width:0"><b>Nocturne in E-flat major, Op. 9 No. 2</b><small>Frédéric Chopin</small></div>
      <div class="k-ctl"><span>1:36</span><div class="k-progress" style="--p:36%"><i></i></div><span>4:30</span><button class="k-iconbtn" aria-label="Previous"><i class="k-icon" data-icon="skip-back"></i></button><button class="k-iconbtn" aria-label="Pause"><i class="k-icon" data-icon="pause"></i></button><button class="k-iconbtn" aria-label="Next"><i class="k-icon" data-icon="skip-forward"></i></button></div></div>
  </div>
  <div class="k-edge" role="toolbar" aria-label="Dock"><u></u><div class="k-edge-in">
    <button aria-label="Screenshot of a region"><i class="k-icon" data-icon="crop"></i></button>
    <button aria-label="Draw on a screenshot"><i class="k-icon" data-icon="pencil"></i></button>
    <button aria-label="Text from the screen"><i class="k-icon" data-icon="type"></i></button>
    <button aria-label="Record a region"><i class="k-icon" data-icon="video"></i></button>
    <button aria-label="Colour picker"><i class="k-icon" data-icon="pipette"></i></button><s></s>
    <button aria-label="Clipboard history"><i class="k-icon" data-icon="clipboard"></i></button>
    <button aria-label="Theme picker"><i class="k-icon" data-icon="palette"></i></button><s></s>
    <button aria-label="Night light"><i class="k-icon" data-icon="moon"></i></button><s></s>
    <button aria-label="Pause"><i class="k-icon" data-icon="pause"></i></button>
    <button class="k-dock-track" data-panel="#p-media" aria-label="Media"><i class="k-icon" data-icon="music"></i><span>Nocturne in E-flat major, Op. 9 No. 2</span></button>
  </div></div>
</div></div>
</div>
<script>
Kit.hydrate(document);
setTimeout(function () { var d = document.getElementById('dock')._k; d.show(); d.open(document.querySelector('.k-edge [data-panel="#p-media"]')); }, 100);
</script>
</body>
</html>
