<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>SlantCard — preview</title></head>
<body>
<div class="k-carousel" style="height:320px" tabindex="-1" aria-label="Themes"><div class="k-carousel-track" id="track"></div></div>
<script>
Kit.hydrate(document);
var GODS = [["Saturnus", "../../assets/Wallpapers/saturnus.jpg"], ["Janus", "../../assets/Wallpapers/janus.jpg"], ["Apollo", "../../assets/Wallpapers/apollo.jpg"], ["Mars", "../../assets/Wallpapers/mars.jpg"], ["Vulcanus", "../../assets/Wallpapers/vulcanus.jpg"], ["Neptunus", "../../assets/Wallpapers/neptunus.jpg"], ["Pluto", "../../assets/Wallpapers/pluto.jpg"], ["Bacchus", "../../assets/Wallpapers/bacchus.jpg"]];
document.getElementById('track').innerHTML = GODS.map(function (g, i) {
  return '<button class="k-slant" aria-selected="' + (i === 0) + '" aria-label="' + g[0] + '"><span class="k-slant-art"><img alt="" src="' + g[1] + '"></span><span class="k-slant-edge"></span><span class="k-slant-name">' + g[0] + '</span></button>';
}).join('');
Kit.hydrate(document);
</script>
</body>
</html>
