<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ContextMenu — preview</title></head>
<body>
<div class="k-stage" style="align-items:flex-start">
  <div class="k-menu k-surface" role="menu">
    <button role="menuitem"><i class="k-icon" data-icon="copy"></i>Copy<kbd>Ctrl C</kbd></button>
    <button role="menuitem"><i class="k-icon" data-icon="clipboard"></i>Paste<kbd>Ctrl V</kbd></button>
    <button role="menuitem" disabled><i class="k-icon" data-icon="image"></i>Set as wallpaper</button>
    <hr>
    <button role="menuitem" data-danger><i class="k-icon" data-icon="trash-2"></i>Delete<kbd>Del</kbd></button>
  </div>
</div>
<script>
Kit.hydrate(document);
